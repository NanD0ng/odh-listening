<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>精听 · ODH 英语学习工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230f766e'/><text x='16' y='23' font-size='19' font-family='Georgia' fill='white' text-anchor='middle'>O</text></svg>" />
<link rel="stylesheet" href="assets/css/app.css" />
<style>
  .hint { font-size: 12px; color: var(--muted); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="mark">O</span>
      <span>ODH<small>ENGLISH LISTENING</small></span>
    </a>
    <span class="sep"></span>
    <div class="crumb">
      <a href="index.html">题库</a><span>/</span><b id="crumb-title">载入中…</b>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="mode-seg">
      <button data-mode="study" class="on">精听模式</button>
      <button data-mode="quiz">答题模式</button>
    </div>
    <button class="pill" id="btn-focus">⛶<span class="hide-sm"> 专注全屏</span></button>
    <a class="pill hide-sm" href="words.html" title="单词库">单词库</a>
    <a class="pill hide-sm" href="roots.html" title="词根记忆法">词根</a>
    <button class="pill ghost" id="btn-nav" title="篇目">☰</button>
  </header>

  <div class="shell">
    <aside class="pane left">
      <div class="pane-head">
        <button class="pane-back" id="btn-nav-back" title="返回上一级">← 返回</button>
        <span class="ttl">篇目 / 题目</span>
        <span class="count" id="left-count">—</span>
      </div>
      <div id="nav-holder"></div>
      <div class="qlist" id="qlist"></div>
    </aside>

    <main class="pane center" id="center">
      <div class="center-head">
        <h2 id="part-title">—</h2>
        <span class="meta" id="part-meta"></span>
        <div class="right">
          <button class="ghost-btn" id="btn-prev-sent" title="上一句（←）">‹ 句</button>
          <button class="ghost-btn" id="btn-next-sent" title="下一句（→）">句 ›</button>
          <button class="ghost-btn" id="btn-sent-loop" title="单句循环（L）">句循环</button>
          <button class="ghost-btn" id="btn-ab" title="A-B 复读（B）">A-B</button>
          <button class="ghost-btn" id="btn-panel" title="解析面板">解析</button>
          <button class="ghost-btn" id="btn-zh">译文</button>
          <button class="ghost-btn on" id="btn-mark">答案标注</button>
          <button class="ghost-btn on" id="btn-follow">字幕跟随</button>
        </div>
      </div>
      <div id="transcript" class="transcript"></div>
      <div id="quiz-view" class="quiz-wrap" style="display:none"></div>
      <button class="follow-pill" id="btn-follow-back">↓ 回到当前句</button>
    </main>

    <aside class="pane right">
      <div class="pane-head">
        <button class="pane-back" id="btn-pane-back" title="返回上一级">← 返回</button>
        <span class="ttl">解析</span>
        <span class="count" id="an-count"></span>
      </div>
      <div class="analysis" id="analysis"></div>
    </aside>
  </div>

  <footer class="player">
    <button class="pbtn" id="btn-play" title="播放 / 暂停（空格）">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>
    </button>
    <button class="pbtn small" id="btn-back" title="后退 10 秒">⟲<span style="font-size:9px">10</span></button>
    <button class="pbtn small" id="btn-fwd" title="前进 10 秒">⟳<span style="font-size:9px">10</span></button>
    <div class="ptime"><b id="t-cur">00:00</b> / <span id="t-dur">00:00</span></div>
    <div class="track" id="track">
      <div class="rail"><div class="buf" id="buf"></div><div class="fill" id="fill"></div></div>
      <div id="markers"></div>
      <div class="knob" id="knob"></div>
    </div>
    <div class="rate" id="rate">
      <button data-r="0.75">0.75×</button>
      <button data-r="1" class="on">1×</button>
      <button data-r="1.25">1.25×</button>
      <button data-r="1.5">1.5×</button>
    </div>
    <div class="ptools">
      <button class="pill ghost" id="btn-go-back" title="返回上一级">←<span class="hide-sm"> 返回</span></button>
      <button class="pill ghost hide-sm" id="btn-ansplay" title="依次播放每题答案句">▶ 答案连播</button>
      <button class="pill ghost hide-sm" id="btn-bounds" title="只在当前范围内播放">本篇限播</button>
    </div>
  </footer>

  <button class="pill primary focus-exit" id="btn-focus-exit">退出专注 Esc</button>

  <div class="pop" id="pop"></div>
  <div class="toast" id="toast"></div>

  <audio id="audio" preload="metadata"></audio>

  <script src="assets/js/data/all_sets.js"></script>
  <script src="assets/js/data/words.js"></script>
  <script src="assets/js/speech.js"></script>
  <script src="assets/js/practice.js"></script>
</body>
</html>
