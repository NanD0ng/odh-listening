<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>词根记忆法 · ODH 英语学习工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230f766e'/><text x='16' y='23' font-size='19' font-family='Georgia' fill='white' text-anchor='middle'>O</text></svg>" />
<link rel="stylesheet" href="assets/css/app.css" />
<style>
  body { overflow: auto; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 26px 80px; }
  .topbar { position: sticky; top: 0; }
  .root-hero { padding: 46px 0 18px; display: grid; grid-template-columns: 1.25fr .75fr; gap: 40px; align-items: end; }
  .kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 2px; color: var(--accent); font-weight: 700; }
  .kicker::before { content: ""; width: 22px; height: 1px; background: var(--accent); }
  .root-hero h1 { margin: 14px 0 12px; font-family: var(--serif); font-size: 46px; line-height: 1.2; letter-spacing: -.5px; }
  .root-hero h1 em { font-style: normal; color: var(--accent); }
  .root-hero p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.9; max-width: 620px; }
  .hero-side {
    background: linear-gradient(135deg, #fffdf8, #f3efe6); border: 1px solid var(--line-strong);
    border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow);
  }
  .hero-side h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: 1.5px; color: var(--muted); }
  .hero-side .nums { display: flex; gap: 22px; flex-wrap: wrap; }
  .hero-side b { font-family: var(--serif); font-size: 24px; }
  .hero-side span { display: block; font-size: 10.5px; color: var(--muted); }
  .hero-side .tip { margin-top: 12px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }

  .toolrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 24px 0 8px; }
  .big-search {
    flex: 1; min-width: 260px; height: 44px; border-radius: 12px; border: 1px solid var(--line-strong);
    background: var(--bg-elev); padding: 0 14px; font-size: 14px; color: var(--ink); outline: none;
  }
  .big-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .big-btn {
    height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--ink-soft); font-size: 13px; font-weight: 600;
  }
  .big-btn:hover { border-color: var(--accent); color: var(--accent); }
  .big-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .big-btn.primary:hover { background: var(--accent-2); }
  .big-btn:disabled { opacity: .42; cursor: not-allowed; }
  .big-btn:disabled:hover { border-color: var(--line-strong); color: var(--ink-soft); background: var(--bg-elev); }
  .big-btn.primary:disabled:hover { background: var(--accent); color: #fff; }
  .toolhint { font-size: 11.5px; color: var(--muted); margin: 0 0 22px; }

  .sec-head { display: flex; align-items: baseline; gap: 14px; margin: 26px 0 14px; }
  .sec-head h2 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .sec-head span { font-size: 12px; color: var(--muted); }
  .sec-head .right { margin-left: auto; display: flex; gap: 16px; font-size: 12px; }
  .sec-head .right a { color: var(--accent); }
  .sec-head .right a:hover { border-bottom: 1px solid var(--accent); }

  .search-panel { display: none; margin: 4px 0 22px; }
  .search-panel.on { display: block; }
  .search-group { margin-bottom: 16px; }
  .search-group h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: 1.3px; color: var(--muted); }
  .search-roots { display: flex; flex-wrap: wrap; gap: 8px; }
  .sr-chip {
    display: inline-flex; align-items: baseline; gap: 8px; border: 1px solid var(--line-strong);
    background: var(--bg-elev); border-radius: 10px; padding: 8px 11px; font-size: 12.5px;
  }
  .sr-chip b { font-family: var(--serif); font-size: 17px; }
  .sr-chip span { color: var(--muted); }
  .sr-chip:hover { border-color: var(--accent); }
  .search-words { display: flex; flex-direction: column; gap: 6px; }
  .sw-row {
    display: flex; align-items: baseline; gap: 10px; padding: 8px 11px; border-radius: 9px;
    border: 1px solid var(--line); background: #fff;
  }
  .sw-row:hover { border-color: var(--accent); }
  .sw-row .w { font-family: var(--serif); font-size: 16px; font-weight: 700; }
  .sw-row .zh { font-size: 12.3px; color: var(--ink-soft); }
  .sw-row .rk { margin-left: auto; font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 8px; }
  .search-empty { font-size: 12.5px; color: var(--muted); padding: 12px; border: 1px dashed var(--line-strong); border-radius: 10px; }

  .root-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 12px; }
  .root-card {
    display: block; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 15px;
    padding: 15px 16px 13px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
    min-height: 132px;
  }
  .root-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent); }
  .rc-top { display: flex; align-items: baseline; gap: 8px; }
  .rc-top .rk { font-family: var(--serif); font-size: 28px; font-weight: 700; line-height: 1.1; }
  .rc-top .rn { margin-left: auto; font-size: 10.5px; color: var(--muted); background: var(--bg-deep); border-radius: 99px; padding: 2px 7px; }
  .rz { margin-top: 3px; font-size: 12.5px; color: var(--accent); font-weight: 600; }
  .rv { margin-top: 3px; font-size: 10.5px; color: var(--muted); }
  .samples { margin-top: 9px; font-size: 11.3px; color: var(--ink-soft); line-height: 1.6; word-break: break-word; }
  .learned-badge {
    display: inline-block; margin-top: 8px; font-size: 10px; color: var(--accent);
    background: var(--accent-soft); border-radius: 99px; padding: 2px 8px; font-weight: 700;
  }
  .root-card.done { border-color: rgba(15,118,110,.35); }

  .empty-card {
    border: 1px dashed var(--line-strong); border-radius: 14px; padding: 46px 20px; text-align: center;
    color: var(--muted); font-size: 13px; line-height: 1.9; background: var(--bg-elev);
  }

  /* detail */
  .backlink {
    display: inline-flex; align-items: center; gap: 5px; margin: 30px 0 18px;
    font-size: 12.5px; color: var(--muted); border: 1px solid var(--line-strong);
    border-radius: 9px; padding: 6px 11px; background: var(--bg-elev);
  }
  .backlink:hover { border-color: var(--accent); color: var(--accent); }
  .root-title { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .root-title .k { font-family: var(--serif); font-size: 62px; line-height: .95; letter-spacing: -1px; }
  .root-title .zh { font-size: 19px; color: var(--accent); font-weight: 600; padding-bottom: 8px; }
  .root-title .actions { margin-left: auto; display: flex; gap: 8px; padding-bottom: 4px; }
  .root-meta { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.8; }
  .root-meta b { color: var(--ink-soft); }
  .root-note {
    margin-top: 14px; max-width: 860px; padding: 12px 15px; border-left: 3px solid var(--gold);
    background: #fffaf0; border-radius: 0 10px 10px 0; font-size: 12.5px; line-height: 1.8; color: #6b5b45;
  }

  .mindmap {
    display: grid; grid-template-columns: 168px 64px minmax(0, 1fr);
    gap: 0; align-items: stretch; margin-top: 26px;
  }
  .mm-left { align-self: start; padding-top: 8px; }
  .root-node {
    background: linear-gradient(135deg, #0f766e, #0b5c56); color: #fff;
    border-radius: 18px; padding: 20px 18px; text-align: center; box-shadow: 0 10px 28px rgba(15,118,110,.22);
  }
  .root-node .k { font-family: var(--serif); font-size: 38px; font-weight: 700; line-height: 1.12; letter-spacing: .5px; }
  .root-node .z { margin-top: 5px; font-size: 12px; opacity: .88; }
  .root-node .n { margin-top: 10px; font-size: 10.5px; opacity: .75; }
  .mm-brace { position: relative; display: flex; align-items: flex-start; padding-top: 0; }
  .mm-brace svg { width: 100%; height: 100%; min-height: 320px; color: var(--accent); opacity: .82; }
  .mm-routes { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .route {
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 16px;
    padding: 13px 15px 14px; box-shadow: 0 1px 2px rgba(23,26,31,.03);
  }
  .route-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .route-no {
    font-size: 10px; font-weight: 800; letter-spacing: .8px; color: var(--accent);
    background: var(--accent-soft); border-radius: 99px; padding: 3px 8px;
  }
  .route-title { font-size: 13px; font-weight: 700; color: var(--ink); }
  .route-sub { font-size: 11px; color: var(--muted); }
  .route-count { margin-left: auto; font-size: 10.5px; color: var(--muted); }
  .route-words { display: grid; grid-template-columns: repeat(auto-fit, minmax(226px, 1fr)); gap: 8px; margin-top: 10px; }
  .wcard {
    background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 9px 10px 8px;
    min-width: 0; transition: border-color .14s, box-shadow .14s;
  }
  .wcard:hover { border-color: var(--line-strong); box-shadow: 0 3px 10px rgba(23,26,31,.05); }
  .wcard.hl { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .wc-line { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .wc-word { font-family: var(--serif); font-size: 18px; font-weight: 700; line-height: 1.25; }
  .wc-pos { font-size: 10.5px; color: var(--accent); font-style: italic; }
  .fam {
    display: inline-flex; align-items: center; gap: 3px; border-radius: 99px;
    padding: 1px 7px; font-size: 10px; font-weight: 700; line-height: 1.6; white-space: nowrap;
  }
  .fam::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .75; }
  .fam.new { background: var(--bg-deep); color: var(--muted); }
  .fam.familiar { background: #e3f2e8; color: var(--ok); }
  .fam.fuzzy { background: var(--gold-soft); color: var(--gold); }
  .fam.unknown { background: #fbeaea; color: var(--danger); }
  .wc-line .fam { margin-left: auto; }
  .wc-mark {
    width: 23px; height: 23px; flex: 0 0 auto; border-radius: 50%;
    border: 1px solid rgba(184,145,75,.5); background: #fff; color: var(--gold);
    font-size: 11px; font-weight: 800; line-height: 1; display: inline-grid; place-items: center;
    padding: 0; transition: .15s;
  }
  .wc-mark:hover { background: var(--gold-soft); border-color: var(--gold); }
  .wc-mark.on { background: var(--gold); border-color: var(--gold); color: #fff; }
  .fam-legend { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 10px; font-size: 10.5px; color: var(--muted); }
  .fam-legend .tip { margin-left: 3px; }
  .wc-zh { margin-top: 3px; font-size: 12px; color: var(--ink-soft); line-height: 1.55; }
  .wc-ph { margin-top: 2px; font-size: 10.5px; color: var(--muted); }
  .wc-morph { margin-top: 7px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); }
  .mchip { display: inline-flex; align-items: baseline; gap: 3px; border-radius: 5px; padding: 1px 5px; background: var(--bg-deep); }
  .mchip b { font-weight: 700; }
  .mchip i { font-style: normal; font-size: 9.5px; opacity: .72; }
  .mchip.pre { background: var(--gold-soft); color: #7a4a08; }
  .mchip.root { background: var(--accent-soft); color: var(--accent); }
  .mchip.suf { background: #eef0f3; color: #59616d; }
  .plus { color: var(--line-strong); font-weight: 700; }
  .morph-text { font-size: 10.5px; color: var(--muted); line-height: 1.55; }

  .noroot-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 18px 0; }
  .noroot-list { display: flex; flex-direction: column; gap: 6px; }
  .nr-row {
    display: flex; align-items: baseline; gap: 10px; padding: 9px 12px;
    background: var(--bg-elev); border: 1px solid var(--line); border-radius: 10px;
  }
  .nr-row .w { font-family: var(--serif); font-size: 16px; font-weight: 700; min-width: 120px; }
  .nr-row .ph { font-size: 11px; color: var(--muted); }
  .nr-row .zh { font-size: 12.2px; color: var(--ink-soft); line-height: 1.6; }
  .nr-row .lv { margin-left: auto; font-size: 10px; color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 1px 7px; }
  .load-more { margin: 16px auto 0; display: block; }

  /* overlay: learn + test */
  .overlay {
    position: fixed; inset: 0; z-index: 120; background: rgba(23,26,31,.42);
    backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 18px;
  }
  .overlay.on { display: flex; }
  .sheet {
    width: min(760px, 100%); max-height: calc(100vh - 36px); overflow: auto;
    background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: 22px;
    box-shadow: 0 24px 70px rgba(23,26,31,.28);
  }
  .sheet-head {
    position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; background: rgba(255,253,248,.94); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  .sheet-head .t { font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--ink-soft); }
  .sheet-head .m { font-size: 11px; color: var(--muted); }
  .sheet-close {
    margin-left: auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--muted); font-size: 15px; line-height: 1; display: grid; place-items: center;
  }
  .sheet-close:hover { border-color: var(--danger); color: var(--danger); }
  .sheet-body { padding: 24px 22px 26px; }
  .learn-progress { height: 4px; background: var(--bg-deep); border-radius: 99px; margin-top: 4px; overflow: hidden; }
  .learn-progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }

  /* word detail modal */
  .word-modal {
    position: fixed; inset: 0; z-index: 150; display: none; align-items: center; justify-content: center;
    padding: 18px; background: rgba(23,26,31,.46); backdrop-filter: blur(4px);
  }
  .word-modal.on { display: flex; }
  .wm-card {
    width: min(580px, 100%); max-height: calc(100vh - 36px); overflow: auto;
    background: var(--bg-elev); border: 1px solid var(--line-strong); border-radius: 22px;
    box-shadow: 0 26px 80px rgba(23,26,31,.3);
  }
  .wm-head { display: flex; align-items: flex-start; gap: 10px; padding: 20px 20px 0; }
  .wm-word { font-family: var(--serif); font-size: 38px; font-weight: 700; line-height: 1.15; word-break: break-word; }
  .wm-ph { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .wm-head .wm-iconbtn { margin-left: auto; }
  .wm-close {
    width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--muted); font-size: 15px; display: grid; place-items: center;
  }
  .wm-close:hover { border-color: var(--danger); color: var(--danger); }
  .wm-body { padding: 10px 20px 20px; }
  .wm-tags { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 6px 0 12px; }
  .wm-tags .root-tag {
    font-size: 10px; color: var(--accent); background: var(--accent-soft);
    border-radius: 99px; padding: 1px 8px; font-weight: 700;
  }
  .wm-mean { font-size: 15px; line-height: 1.75; color: var(--ink-soft); }
  .wm-mean .pos { color: var(--accent); font-style: italic; margin-right: 5px; }
  .wm-morph { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 12px; }
  .wm-example {
    margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--accent);
    background: #f4fbf9; border-radius: 0 11px 11px 0;
  }
  .wm-example .lab { font-size: 10px; letter-spacing: 1.3px; color: var(--muted); font-weight: 700; }
  .wm-example .s { margin-top: 5px; font-family: var(--serif); font-size: 15px; line-height: 1.8; color: #2b3038; }
  .wm-example .cn { margin-top: 4px; font-size: 12.5px; line-height: 1.75; color: var(--ink-soft); }
  .wm-example .src { margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .wm-example .empty { margin-top: 5px; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .wm-example-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 8px; }
  .wm-play {
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line-strong);
    background: #fff; color: var(--accent); border-radius: 8px; padding: 5px 10px; font-size: 11.5px; font-weight: 600;
  }
  .wm-play:hover { border-color: var(--accent); background: var(--accent-soft); }
  .wm-play svg { width: 14px; height: 14px; }
  .wm-actions { display: flex; gap: 8px; margin-top: 18px; }
  .wm-btn {
    flex: 1; height: 42px; border-radius: 11px; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--ink-soft); font-size: 13px; font-weight: 700;
  }
  .wm-btn.known { color: var(--ok); border-color: var(--ok); }
  .wm-btn.unknown { color: var(--danger); border-color: var(--danger); }
  .wm-btn:hover { background: var(--bg-deep); }
  .wm-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .wm-btn.known.on { background: #e3f2e8; border-color: var(--ok); color: var(--ok); }
  .wm-btn.unknown.on { background: #fbeaea; border-color: var(--danger); color: var(--danger); }
  .wm-actions-hint { margin-top: 8px; font-size: 10.5px; color: var(--muted); line-height: 1.6; }

  .learn-intro { text-align: center; max-width: 560px; margin: 6px auto 0; }
  .li-root { font-family: var(--serif); font-size: 54px; font-weight: 700; line-height: 1; }
  .li-zh { margin-top: 8px; font-size: 18px; color: var(--accent); font-weight: 600; }
  .li-note { margin-top: 14px; font-size: 13px; line-height: 1.9; color: var(--ink-soft); }
  .li-meta { margin-top: 18px; display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
  .li-meta b { display: block; font-family: var(--serif); font-size: 24px; }
  .li-meta span { font-size: 10.5px; color: var(--muted); }
  .learn-start {
    margin-top: 26px; height: 46px; padding: 0 30px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 700;
  }
  .learn-start:hover { background: var(--accent-2); }

  .learn-card {
    text-align: center; max-width: 620px; margin: 0 auto; padding: 26px 22px 22px;
    background: linear-gradient(135deg, rgba(255,255,255,.74), rgba(255,255,255,.42));
    border: 1px solid rgba(255,255,255,.88); border-radius: 26px;
    box-shadow: 0 26px 70px rgba(31,45,61,.14), inset 0 1px 0 rgba(255,255,255,.94);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
  }
  .lc-toprow { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .relearn-badge {
    font-size: 9.5px; font-weight: 700; color: var(--danger);
    background: #fbeaea; border-radius: 99px; padding: 1px 7px; white-space: nowrap;
  }
  .learn-prev {
    display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--ink-soft); border-radius: 8px; padding: 5px 10px; font-size: 11.5px;
  }
  .learn-prev:hover { border-color: var(--accent); color: var(--accent); }
  .learn-prev:disabled { opacity: .38; pointer-events: none; }
  .lc-toprow .cur-fam { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .lc-wordrow { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
  .lc-word {
    font-family: var(--serif); font-size: 54px; font-weight: 700; line-height: 1.15;
    letter-spacing: .5px; word-break: break-word; background: transparent; border: 0;
    padding: 0; color: var(--ink); cursor: pointer; text-align: center;
  }
  .lc-word:hover { color: var(--accent); }
  .lc-speak {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-strong);
    background: var(--bg-elev); color: var(--accent); display: grid; place-items: center; flex: 0 0 auto;
  }
  .lc-speak:hover { border-color: var(--accent); background: var(--accent-soft); }
  .lc-speak svg { width: 18px; height: 18px; }
  .lc-mark {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(184,145,75,.5);
    background: var(--bg-elev); color: var(--gold); font-size: 13px; font-weight: 800;
    display: grid; place-items: center; flex: 0 0 auto;
  }
  .lc-mark:hover { background: var(--gold-soft); border-color: var(--gold); }
  .lc-mark.on { background: var(--gold); border-color: var(--gold); color: #fff; }
  .lc-ph { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .tts-toggle {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 14px;
    font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .tts-toggle input { accent-color: var(--accent); width: 14px; height: 14px; }
  .lc-break { margin-top: 18px; display: flex; justify-content: center; align-items: center; gap: 5px; flex-wrap: wrap; font-size: 12px; }
  .lc-mean {
    margin: 18px auto 0; max-width: 460px; min-height: 28px; font-size: 16px; line-height: 1.65;
    color: var(--ink-soft); transition: filter .18s ease; cursor: pointer;
  }
  .lc-mean .pos { color: var(--accent); font-style: italic; margin-right: 5px; }
  .lc-mean.hide { filter: blur(6px); user-select: none; }
  .lc-hint { margin-top: 5px; font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  .learn-btns { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; }
  .learn-btns button {
    flex: 1; min-width: 120px; height: 46px; border-radius: 12px; background: #fff;
    font-size: 14px; font-weight: 700; border: 1px solid var(--line-strong);
  }
  .learn-btns button.know { color: var(--ok); border-color: var(--ok); }
  .learn-btns button.fuzzy { color: var(--gold); border-color: var(--gold); }
  .learn-btns button.dont { color: var(--danger); border-color: var(--danger); }
  .learn-btns button:hover { background: var(--bg-deep); }
  .learn-btns button:disabled { opacity: .55; pointer-events: none; }

  .round-done { text-align: center; max-width: 520px; margin: 10px auto 0; }
  .round-done h3 { margin: 0 0 10px; font-size: 24px; font-family: var(--serif); }
  .round-done p { margin: 0 0 8px; font-size: 13px; color: var(--muted); line-height: 1.8; }
  .round-done .nums { display: flex; justify-content: center; gap: 26px; margin: 20px 0 26px; }
  .round-done .nums b { display: block; font-family: var(--serif); font-size: 26px; }
  .round-done .nums span { font-size: 10.5px; color: var(--muted); }
  .round-done .n-know b { color: var(--ok); }
  .round-done .n-fuzzy b { color: var(--gold); }
  .round-done .n-dont b { color: var(--danger); }

  .test-setup { max-width: 520px; margin: 0 auto; }
  .test-setup h3 { margin: 0 0 6px; font-size: 22px; font-family: var(--serif); }
  .test-setup .sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .opt-row { margin-bottom: 16px; }
  .opt-row .lab { font-size: 11px; letter-spacing: 1.2px; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .choice-chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .choice-chips button {
    border: 1px solid var(--line-strong); background: var(--bg-elev); border-radius: 9px;
    padding: 8px 12px; font-size: 12.5px; color: var(--ink-soft);
  }
  .choice-chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .choice-chips button span { font-size: 10.5px; opacity: .75; margin-left: 4px; }
  .test-start { width: 100%; height: 46px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; margin-top: 8px; }
  .test-start:hover { background: var(--accent-2); }

  .test-card { text-align: center; max-width: 620px; margin: 0 auto; }
  .test-word { font-family: var(--serif); font-size: 50px; font-weight: 700; line-height: 1.2; word-break: break-word; }
  .test-ph { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .test-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 26px; }
  .test-opt {
    min-height: 54px; border: 1px solid var(--line-strong); background: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); text-align: left;
  }
  .test-opt:hover { border-color: var(--accent); }
  .test-opt.right { border-color: var(--ok); background: #e9f5ec; color: var(--ok); font-weight: 600; }
  .test-opt.wrong { border-color: var(--danger); background: #fbeaea; color: var(--danger); }
  .test-opt:disabled { cursor: default; }
  .test-result { max-width: 620px; margin: 0 auto; }
  .test-score { display: flex; align-items: baseline; gap: 14px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .test-score b { font-family: var(--serif); font-size: 44px; }
  .test-score span { font-size: 12.5px; color: var(--muted); }
  .wrong-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .wrong-row { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .wrong-row .w { font-family: var(--serif); font-size: 17px; font-weight: 700; }
  .wrong-row .zh { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .result-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .result-btns button { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg-elev); font-size: 12.5px; }
  .result-btns button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .result-btns button:hover { border-color: var(--accent); color: var(--accent); }
  .result-btns button.primary:hover { color: #fff; }

  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translate(-50%, 12px);
    background: rgba(23,26,31,.92); color: #fff; font-size: 12.5px; padding: 9px 15px;
    border-radius: 99px; opacity: 0; pointer-events: none; transition: .16s ease; z-index: 200;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 900px) {
    .root-hero { grid-template-columns: 1fr; gap: 22px; padding-top: 32px; }
    .root-hero h1 { font-size: 38px; }
    .mindmap { grid-template-columns: 1fr; }
    .mm-left { position: static; padding: 0; }
    .root-node { flex-wrap: wrap; }
    .root-node { display: flex; align-items: baseline; justify-content: center; gap: 12px; padding: 14px; }
    .root-node .k { font-size: 30px; }
    .root-node .n { margin-top: 0; }
    .mm-brace { display: none; }
    .mm-routes { margin-top: 14px; }
    .root-title .k { font-size: 46px; }
    .root-title .actions { width: 100%; margin-left: 0; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 0 15px 60px; }
    .root-hero h1 { font-size: 32px; }
    .toolrow { gap: 8px; }
    .big-search { min-width: 100%; }
    .big-btn { flex: 1; padding: 0 12px; }
    .root-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
    .root-card { padding: 12px 12px 11px; min-height: 118px; }
    .rc-top .rk { font-size: 23px; }
    .samples { font-size: 10.5px; }
    .route-words { grid-template-columns: 1fr; }
    .root-title .actions { flex-wrap: wrap; }

    .word-modal { padding: 10px; }
    .wm-card { max-height: calc(100vh - 20px); border-radius: 18px; }
    .wm-head { padding: 16px 16px 0; }
    .wm-body { padding: 8px 16px 16px; }

    .learn-btns button { min-width: 30%; }
    .nr-row { flex-wrap: wrap; }
    .nr-row .zh { width: 100%; }
    .nr-row .lv { margin-left: 0; }
  }
</style>

<body>
  <header class="topbar">

    </a>
    <span class="sep"></span>
    <div class="crumb"><a href="index.html">首页</a><span>/</span><b id="crumb">词根记忆法</b></div>
    <div class="spacer"></div>
    <a class="pill" href="study.html">随机背单词</a>
    <a class="pill" href="sets.html">听力题库</a>
    <a class="pill" href="words.html">单词库</a>

  <div class="wrap">
    <section id="home-view">
      <div class="root-hero">
        <div>
          <div class="kicker">ODH · ROOT MEMORY</div>
          <h1>一个词根，<br>牵出一串<em>同源词</em>。</h1>
          <p>把四六级高频词根按“前缀 + 词根 + 后缀”拆开记。点开词根看演绎路线，背诵时每个词过三遍，再用检测模式验证掌握度。</p>
          <div class="toolrow">
            <input class="big-search" id="search" placeholder="搜索词根 / 单词，例如 dict、predict、ad-" autocomplete="off" />
            <button class="big-btn primary" id="btn-learn">开始背单词</button>
            <button class="big-btn" id="btn-test">单词检测</button>
          </div>
          <p class="toolhint" id="toolhint">点击任意词根进入思维导图；搜索支持词根、变体、英文单词与中文释义。</p>
        </div>
        <aside class="hero-side">
          <h4>词根库</h4>

            <div><b id="n-roots">0</b><span>个词根</span></div>
            <div><b id="n-words">0</b><span>个词</span></div>
            <div><b id="n-learned">0</b><span>已背词</span></div>
            <div><b id="n-noroot">0</b><span>无词根词</span></div>
          </div>
          <div class="tip">词根按收录词数排序；每个词都标出前缀、词根、后缀的含义。背单词默认从还没背完的词根开始。</div>
        </aside>
      </div>

      <div class="search-panel" id="search-panel"></div>

      <div class="sec-head">
        <h2>全部词根</h2><span id="grid-hint">按收录词数排序</span>
        <div class="right"><a href="roots.html?view=noroot">无词根词 →</a><a href="roots.html?view=all">清空筛选</a></div>
      </div>
      <div class="root-grid" id="root-grid"></div>
    </section>

    <section id="detail-view" style="display:none"></section>
    <section id="noroot-view" style="display:none"></section>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet">
      <div class="sheet-head">
        <span class="t" id="sheet-title">词根记忆</span>
        <span class="m" id="sheet-meta"></span>
        <button class="sheet-close" id="sheet-close" aria-label="关闭">✕</button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div class="word-modal" id="word-modal">
    <div class="wm-card" id="wm-card"></div>
  </div>
  <div id="toast"></div>

  <script src="assets/js/speech.js"></script>
  <script src="assets/js/data/examples.js"></script>
  <script src="assets/js/data/roots.js"></script>
  <script>
  (function () {
    'use strict';
    const A = window.ODH_ROOTS;
    if (!A || !A.roots) {
      document.body.innerHTML = '<div style="padding:60px;font-family:sans-serif">词根数据未载入，请检查 assets/js/data/roots.js。</div>';
      return;
    }
    const ROOTS = A.roots;
    const NOROOT = A.noroot || [];
    const LEARN_KEY = 'odh.rootlearn.v1';
    const UNKNOWN_KEY = 'odh.unknown.v1';
    const $ = s => document.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const params = new URLSearchParams(location.search);

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function readJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; } catch (e) { return fallback; }
    }
    function writeJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    function shuffle(list) {
      const a = list.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('on');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('on'), 1900);
    }
    function posText(w) { return w.pos ? w.pos + ' ' : ''; }
    function phText(p) { return String(p || '').split(/[;；]/)[0].trim(); }
    function rootByKey(k) { return ROOTS.find(r => r.k === k); }

    const TTS_KEY = 'odh.ttsauto.v1';
    let ttsAuto = localStorage.getItem(TTS_KEY) !== '0';
    function speakText(text, rate) {
      if (!text) return;
      if (window.ODHSpeech) { ODHSpeech.speak(text, { rate: rate || (text.split(/\s+/).length > 2 ? 0.96 : 0.9) }); return; }
      if (!('speechSynthesis' in window)) { toast('当前浏览器不支持语音朗读'); return; }
      try {
        const synth = window.speechSynthesis;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        u.rate = rate || 0.9;
        u.pitch = 1.02;
        const voices = synth.getVoices() || [];
        const voice = voices.find(v => /en[-_]US/i.test(v.lang) && /Natural|Neural|Aria|Guy|Jenny/i.test(v.name))
          || voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
        if (voice) u.voice = voice;
        synth.speak(u);
      } catch (e) {
        toast('发音失败，请检查系统语音');
      }
    }
    function speakWord(text) { speakText(text, 0.9); }

    const SPK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h4l5 4V5.5l-5 4H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>`;

    let wordModalOpen = false;
    let wordModalWord = null;
    let wordModalRoot = '';
    let exampleSeq = 0;

    function localExample(w) {
      const x = EXAMPLES[w];
      if (x && x.s) return { s: x.s, cn: x.cn || '', src: x.src || '', kind: x.kind || '', local: true };
      const cache = readJSON(EXAMPLE_CACHE_KEY, {});
      if (cache[w] && cache[w].s) return { s: cache[w].s, cn: '', src: '来自在线词典', online: true };
      return null;
    }

    async function fetchExample(word) {
      let timer = null;
      try {
        const ctrl = new AbortController();
        timer = setTimeout(() => ctrl.abort(), 9000);
        const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), { signal: ctrl.signal });
        if (!res.ok) return null;
        const data = await res.json();
        for (const entry of data) {
          for (const meaning of entry.meanings || []) {
            for (const def of meaning.definitions || []) {
              const s = (def.example || '').trim();
              if (!s) continue;
              const n = s.split(/\s+/).length;
              if (n < 4 || n > 42) continue;
              const cache = readJSON(EXAMPLE_CACHE_KEY, {});
              cache[word] = { s, at: Date.now() };
              writeJSON(EXAMPLE_CACHE_KEY, cache);
              return { s, src: '来自在线词典', online: true };
            }
          }
        }
        return null;
      } catch (e) {
        return null;
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    function exampleBlock(example) {
      if (example && example.s) {
        return `<div class="s">${esc(example.s)}</div>
          ${example.cn ? `<div class="cn">${esc(example.cn)}</div>` : ''}
          <div class="src">${esc(example.src || '')}</div>
          <div class="wm-example-actions"><button class="wm-play" id="wm-play-example">${SPK_SVG} 播放例句</button></div>`;
      }
      if (example && example.missing) {
        return `<div class="empty">本地例句库没有收录这个词，联网也没有查到例句。<button class="wm-play" id="wm-retry" style="margin-left:6px">重试</button></div>`;
      }
      return `<div class="empty">正在联网查例句…</div>`;
    }

    function renderWordModal(w, rootKey, example) {
      const level = wordLevel(w.w);
      const root = rootByKey(rootKey);
      $('#wm-card').innerHTML = `
        <div class="wm-head">
          <div>
            <div class="wm-word">${esc(w.w)}</div>
            ${w.p ? `<div class="wm-ph">${esc(phText(w.p))}</div>` : ''}
          </div>
          <button class="lc-speak wm-iconbtn" id="wm-play-word" title="朗读单词" aria-label="朗读单词">${SPK_SVG}</button>
          <button class="wm-close" id="wm-close" aria-label="关闭">✕</button>
        </div>
        <div class="wm-body">
          <div class="wm-tags">
            <span class="fam ${level}" id="wm-fam">${FAM[level]}</span>
            <span class="root-tag">${esc(rootKey)}${root ? ' · ' + esc(root.zh) : ''}</span>
            ${w.pos ? `<span class="root-tag">${esc(w.pos)}</span>` : ''}
          </div>
          <div class="wm-mean">${w.pos ? `<span class="pos">${esc(w.pos)}</span>` : ''}${esc(w.zh || '')}</div>
          <div class="wm-morph">${morphHtml(w)}</div>
          <div class="wm-example">
            <div class="lab">例句</div>
            ${exampleBlock(example)}
          </div>
          <div class="wm-actions">
            <button class="wm-btn known ${level === 'familiar' ? 'on' : ''}" data-fam-act="familiar">熟词</button>
            <button class="wm-btn unknown ${level === 'unknown' ? 'on' : ''}" data-fam-act="unknown">陌生词</button>
          </div>
          <div class="wm-actions-hint">熟词会移出后续随机池；陌生词会加入生词本，并保留在后续轮次。设置后可继续在卡片上选择认识 / 模糊 / 不认识。</div>
        </div>`;
      $('#wm-close').addEventListener('click', closeWordModal);
      $('#wm-play-word').addEventListener('click', () => speakWord(w.w));
      const playEx = $('#wm-play-example');
      if (playEx && example && example.s) playEx.addEventListener('click', () => speakText(example.s, 0.94));
      const retry = $('#wm-retry');
      if (retry) retry.addEventListener('click', () => loadExample(w, rootKey));
      $$('#wm-card [data-fam-act]').forEach(btn => btn.addEventListener('click', () => {
        const act = btn.dataset.famAct;
        setFamiliar(w.w, rootKey, act);
        if (act === 'familiar') syncUnknownKnown(w.w, true);
        else {
          addUnknown(w.w, rootKey);
          syncUnknownKnown(w.w, false);
          setRelearn(w.w, rootKey, 3);
          if (overlayMode && overlayMode.type === 'learn') overlayMode.forcedThisRound.add(w.w);
        }
        const famEl = $('#wm-fam');
        if (famEl) { famEl.className = 'fam ' + act; famEl.textContent = FAM[act]; }
        $$('#wm-card [data-fam-act]').forEach(x => x.classList.toggle('on', x.dataset.famAct === act));
        const lf = $('#learn-fam');
        if (lf && wordModalWord && wordModalWord.w === w.w) {
          lf.className = 'fam ' + act;
          lf.textContent = FAM[act];
        }
        refreshFamiliarBadges();
        toast(act === 'familiar' ? '已标记为熟词，后续轮次不再出现' : '已标记为陌生词，保留在后续轮次');
      }));
    }

    function loadExample(w, rootKey) {
      const seq = ++exampleSeq;
      const local = localExample(w.w);
      renderWordModal(w, rootKey, local);
      if (local) return;
      fetchExample(w.w).then(ex => {
        if (!wordModalOpen || seq !== exampleSeq || !wordModalWord || wordModalWord.w !== w.w) return;
        renderWordModal(w, rootKey, ex || { missing: true });
      });
    }

    function openWordModal(w, rootKey) {
      wordModalOpen = true;
      wordModalWord = w;
      wordModalRoot = rootKey;
      $('#word-modal').classList.add('on');
      loadExample(w, rootKey);
    }

    function closeWordModal() {
      wordModalOpen = false;
      wordModalWord = null;
      exampleSeq++;
      $('#word-modal').classList.remove('on');
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
      const L = overlayMode;
      if (L && L.type === 'learn' && L.advancePending) {
        L.advancePending = false;
        L.advanceTimer = setTimeout(() => {
          L.advanceTimer = null;
          if (overlayMode === L && !wordModalOpen && $('#overlay').classList.contains('on')) advanceLearnCard(L);
        }, 260);
      }
    }
    $('#word-modal').addEventListener('click', e => { if (e.target === $('#word-modal')) closeWordModal(); });

    function refreshFamiliarBadges() {
      if (!detailRootKey) return;
      const r = rootByKey(detailRootKey);
      if (!r) return;
      let famN = 0;
      r.routes.forEach(rt => rt.words.forEach(w => { if (wordLevel(w.w) === 'familiar') famN++; }));
      const cnt = $('#detail-fam-count');
      if (cnt) cnt.textContent = famN;
      $$('#detail-view .wcard .fam').forEach(el => {
        const card = el.closest('.wcard');
        if (card) el.outerHTML = famBadge(card.dataset.w);
      });
    }
    function allWords() {
      const seen = Object.create(null), out = [];
      ROOTS.forEach(r => r.routes.forEach(rt => rt.words.forEach(w => {
        if (seen[w.w]) return;
        seen[w.w] = 1;
        out.push(Object.assign({}, w, { rootKey: r.k, rootZh: r.zh }));
      })));
      return out;
    }
    function wordRoots() {
      const map = Object.create(null);
      ROOTS.forEach(r => r.routes.forEach(rt => rt.words.forEach(w => {
        if (!map[w.w]) map[w.w] = [];
        if (!map[w.w].some(x => x.k === r.k)) map[w.w].push({ k: r.k, zh: r.zh });
      })));
      return map;
    }
    const WORD_ROOTS = wordRoots();
    const ALL_WORDS = allWords();
    const EXAMPLES = (window.ODH_EXAMPLES && window.ODH_EXAMPLES.examples) || {};
    const EXAMPLE_CACHE_KEY = 'odh.example.v1';
    const AUTO_NEXT_MS = 1900;

    let learnData = readJSON(LEARN_KEY, { words: {}, roots: {}, familiar: {} });
    learnData.words = learnData.words || {};
    learnData.roots = learnData.roots || {};
    learnData.familiar = learnData.familiar || {};
    function learnedWords() { return Object.keys(learnData.words || {}); }
    function rootDone(k) { const x = learnData.roots && learnData.roots[k]; return !!(x && (x.done || x.rounds >= 3)); }

    const FAM = {
      new: '未学', familiar: '熟悉', fuzzy: '模糊', unknown: '不认识',
    };
    function wordLevel(w) {
      const has = Object.prototype.hasOwnProperty;
      const f = has.call(learnData.familiar, w) ? learnData.familiar[w] : null;
      if (f && f.level) return f.level;
      if (has.call(learnData.words, w) && learnData.words[w]) return 'familiar';
      return 'new';
    }
    function famBadge(w, extra) {
      const level = wordLevel(w);
      return `<span class="fam ${level}">${FAM[level]}${extra || ''}</span>`;
    }
    function setFamiliar(w, rootKey, level) {
      const old = Object.prototype.hasOwnProperty.call(learnData.familiar, w) ? learnData.familiar[w] : null;
      learnData.familiar[w] = {
        level, at: Date.now(), root: rootKey || (old && old.root) || '',
        n: ((old && old.n) || 0) + 1,
        relearn: old ? (old.relearn || 0) : 0,
      };
      writeJSON(LEARN_KEY, learnData);
    }
    function relearnLeft(w) {
      const f = Object.prototype.hasOwnProperty.call(learnData.familiar, w) ? learnData.familiar[w] : null;
      return f && Number(f.relearn) > 0 ? Number(f.relearn) : 0;
    }
    function needsRounds(w) {
      return wordLevel(w) !== 'familiar' || relearnLeft(w) > 0;
    }
    function roundDecWords(L) {
      const out = new Set();
      (L.rounds[L.round] || []).forEach(w => {
        if (L.forcedThisRound.has(w.w)) return;
        if (relearnLeft(w.w) > 0) out.add(w.w);
      });
      return out;
    }
    function applyRoundRelearn(L, dec) {
      dec.forEach(w => {
        const f = Object.prototype.hasOwnProperty.call(learnData.familiar, w) ? learnData.familiar[w] : null;
        if (f && f.relearn > 0) {
          f.relearn--;
          if (!f.relearn) delete f.relearn;
        }
      });
      writeJSON(LEARN_KEY, learnData);
      L.forcedThisRound = new Set();
    }
    function remainingAfterRound(L, dec) {
      return L.words.filter(w => {
        const level = wordLevel(w.w);
        const f = Object.prototype.hasOwnProperty.call(learnData.familiar, w.w) ? learnData.familiar[w.w] : null;
        let r = f && f.relearn > 0 ? f.relearn : 0;
        if (dec.has(w.w)) r = Math.max(0, r - 1);
        return level !== 'familiar' || r > 0;
      });
    }
    function setRelearn(w, rootKey, n) {
      const old = Object.prototype.hasOwnProperty.call(learnData.familiar, w) ? learnData.familiar[w] : null;
      learnData.familiar[w] = {
        level: (old && old.level) || 'unknown',
        at: Date.now(),
        root: rootKey || (old && old.root) || '',
        n: (old && old.n) || 0,
        relearn: Math.max(0, n || 0),
      };
      writeJSON(LEARN_KEY, learnData);
    }
    function removeRootUnknown(w, rootKey) {
      const u = readJSON(UNKNOWN_KEY, {});
      if (u[w] && u[w].src === 'root' && u[w].root === rootKey) {
        delete u[w];
        writeJSON(UNKNOWN_KEY, u);
      }
    }

    /* ---------------- persistence ---------------- */
    function addUnknown(w, rootKey) {
      const u = readJSON(UNKNOWN_KEY, {});
      if (!Object.prototype.hasOwnProperty.call(u, w)) u[w] = { count: 1, lastAt: Date.now(), known: false, src: 'root', root: rootKey };
      else {
        u[w].known = false;
        u[w].lastAt = Date.now();
        if (!u[w].count) u[w].count = 1;
      }
      writeJSON(UNKNOWN_KEY, u);
    }
    function syncUnknownKnown(w, known) {
      const u = readJSON(UNKNOWN_KEY, {});
      if (Object.prototype.hasOwnProperty.call(u, w)) {
        u[w].known = known;
        u[w].lastAt = Date.now();
        writeJSON(UNKNOWN_KEY, u);
      }
    }

    /* ---------------- search ---------------- */
    function searchAll(q) {
      const qq = q.trim().toLowerCase();
      if (!qq) return null;
      const roots = ROOTS.filter(r =>
        r.k.toLowerCase().includes(qq) ||
        (r.v || []).some(v => v.toLowerCase().includes(qq)) ||
        (r.zh || '').includes(q) ||
        (r.routes || []).some(rt => rt.words.some(w => w.w.toLowerCase().includes(qq) || (w.zh || '').includes(q)))
      ).slice(0, 18);
      const words = [];
      const seen = Object.create(null);
      ROOTS.forEach(r => r.routes.forEach(rt => rt.words.forEach(w => {
        if (seen[w.w]) return;
        if (w.w.toLowerCase().includes(qq) || (w.zh || '').includes(q) || (w.pos || '').includes(qq)) {
          seen[w.w] = 1;
          words.push(Object.assign({}, w, { rootKey: r.k, rootZh: r.zh }));
        }
      })));
      return { roots, words: words.slice(0, 36) };
    }

    function renderSearch(box, q) {
      if (!q || !q.trim()) { box.classList.remove('on'); box.innerHTML = ''; return; }
      const res = searchAll(q);
      if (!res || (!res.roots.length && !res.words.length)) {
        box.innerHTML = `<div class="search-empty">没有找到“${esc(q)}”。试试词根变体（如 ceiv / cept）或只输入几个字母。</div>`;
        box.classList.add('on');
        return;
      }
      let html = '';
      if (res.roots.length) {
        html += `<div class="search-group"><h4>匹配词根 ${res.roots.length}</h4><div class="search-roots">` +
          res.roots.map(r => `<a class="sr-chip" href="roots.html?root=${encodeURIComponent(r.k)}"><b>${esc(r.k)}</b><span>${esc(r.zh)} · ${r.n} 词</span></a>`).join('') +
          '</div></div>';
      }
      if (res.words.length) {
        html += `<div class="search-group"><h4>匹配单词 ${res.words.length}</h4><div class="search-words">` +
          res.words.map(w => `<a class="sw-row" href="roots.html?root=${encodeURIComponent(w.rootKey)}&w=${encodeURIComponent(w.w)}">
            <span class="w">${esc(w.w)}</span><span class="zh">${esc(posText(w))}${esc(w.zh)}</span>
            <span class="rk">${esc(w.rootKey)} · ${esc(w.rootZh)}</span></a>`).join('') +
          '</div></div>';
      }
      box.innerHTML = html;
      box.classList.add('on');
    }

    /* ---------------- home ---------------- */
    function renderHome() {
      const learned = learnedWords().length;
      $('#n-roots').textContent = A.meta.roots;
      $('#n-words').textContent = A.meta.uniqueWords;
      $('#n-learned').textContent = learned;
      $('#n-noroot').textContent = A.meta.noroot;
      const grid = $('#root-grid');
      const list = ROOTS.slice();
      grid.innerHTML = list.map(r => {
        const done = rootDone(r.k);
        return `<a class="root-card${done ? ' done' : ''}" href="roots.html?root=${encodeURIComponent(r.k)}" data-k="${esc(r.k)}" data-zh="${esc(r.zh)}" data-v="${esc((r.v || []).join(' '))}" data-s="${esc((r.samples || []).join(' ').toLowerCase())}">
          <div class="rc-top"><span class="rk">${esc(r.k)}</span><span class="rn">${r.n} 词</span></div>
          <div class="rz">${esc(r.zh)}</div>
          <div class="rv">${esc((r.v || []).slice(0, 4).join(' / '))}${r.routes.length > 1 ? ' · ' + r.routes.length + ' 条路线' : ''}</div>
          <div class="samples">${esc((r.samples || []).join(' · '))}</div>
          ${done ? '<span class="learned-badge">已背完这个词根</span>' : ''}
        </a>`;
      }).join('');
      renderSearch($('#search-panel'), params.get('q') || '');
      if (params.get('q')) $('#search').value = params.get('q');
    }

    /* ---------------- detail ---------------- */
    function morphHtml(w) {
      if (w.morph) return `<span class="morph-text">${esc(w.morph)}</span>`;
      const parts = [];
      if (w.pre) parts.push(`<span class="mchip pre"><b>${esc(w.pre)}</b><i>${esc(w.preZh || '')}</i></span>`);
      parts.push(`<span class="mchip root"><b>${esc(w.rootRaw || '')}</b><i>${esc(w.rootZh || '')}</i></span>`);
      if (w.suf) parts.push(`<span class="mchip suf"><b>${esc(w.suf)}</b><i>${esc(w.sufZh || '')}</i></span>`);
      return parts.join('<span class="plus">+</span>');
    }

    let detailRootKey = null;
    function renderDetail(key, highlightWord) {
      const r = rootByKey(key);
      if (!r) { renderHome(); return; }
      detailRootKey = key;
      const unknownNow = readJSON(UNKNOWN_KEY, {});
      let famN = 0;
      r.routes.forEach(rt => rt.words.forEach(w => { if (wordLevel(w.w) === 'familiar') famN++; }));
      $('#crumb').textContent = '词根 · ' + r.k;
      document.title = r.k + ' · 词根记忆法 · ODH';
      $('#home-view').style.display = 'none';
      $('#detail-view').style.display = 'block';
      $('#noroot-view').style.display = 'none';
      let routes = '';
      r.routes.forEach((rt, i) => {
        routes += `<section class="route">
          <div class="route-head">

            <span class="route-title">${esc(rt.label)}</span>

            <span class="route-count">${rt.words.length} 词</span>
          </div>
          <div class="route-words">${rt.words.map(w => `<article class="wcard${highlightWord === w.w ? ' hl' : ''}" data-w="${esc(w.w)}">
            <div class="wc-line"><span class="wc-word">${esc(w.w)}</span><span class="wc-pos">${esc(w.pos || '')}</span>${famBadge(w.w)}<button class="wc-mark${Object.prototype.hasOwnProperty.call(unknownNow, w.w) && !unknownNow[w.w].known ? ' on' : ''}" type="button" data-mark-word="${esc(w.w)}" data-mark-root="${esc(r.k)}" title="加入生词本 · 之后在单词库找它">陌</button></div>
            <div class="wc-zh">${esc(w.zh || '')}</div>
            ${w.p ? `<div class="wc-ph">${esc(phText(w.p))}</div>` : ''}
            <div class="wc-morph">${morphHtml(w)}</div>
          </article>`).join('')}</div>
        </section>`;
      });
      const learnedCount = (learnData.words && Object.keys(learnData.words).length) || 0;
      const hfN = hfWordsOf(r).length;
      const noHf = hfN ? '' : ' disabled title="本词根暂无六级高频词"';
      $('#detail-view').innerHTML = `
        <a class="backlink" href="roots.html">← 全部词根</a>
        <div class="root-title">
          <div class="k">${esc(r.k)}</div>
          <div class="zh">${esc(r.zh)}</div>
          <div class="actions">
            <button class="big-btn primary" data-learn="${esc(r.k)}"${noHf}>背这个词根</button>
            <button class="big-btn" data-test-root="${esc(r.k)}"${noHf}>检测这个词根</button>
          </div>
        </div>
        <div class="root-meta"><b>${r.n}</b> 个词 · 六级高频 <b>${hfN}</b> 个 · <b>${r.routes.length}</b> 条演绎路线 · 已熟悉 <b id="detail-fam-count">${famN}</b> 个 · 变体 ${esc((r.v || []).join(' / '))}${rootDone(r.k) ? ' · <span style="color:var(--accent)">已背完</span>' : ''}</div>
        <div class="root-note">${esc(r.note || '')}</div>
        <div class="fam-legend">
          <span class="fam new">未学</span><span class="fam fuzzy">模糊</span><span class="fam unknown">不认识</span><span class="fam familiar">熟悉</span>
          <span class="tip">标识来自背单词与检测记录，只存本机</span>
        </div>
        <div class="mindmap">
          <div class="mm-left"><div class="root-node"><div class="k">${esc(r.k)}</div><div class="z">${esc(r.zh)}</div><div class="n">${r.n} 词 · ${r.routes.length} 路线</div></div></div>
          <div class="mm-brace"><svg viewBox="0 0 44 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M 41 0 C 20 0 29 9 29 26 C 29 42 29 46 4 50 C 29 54 29 58 29 74 C 29 91 20 100 41 100"
              fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          </svg></div>
          <div class="mm-routes">${routes}</div>
        </div>`;
      if (highlightWord) {
        const el = $('#detail-view .wcard.hl');
        if (el) setTimeout(() => el.scrollIntoView({ block: 'center', behavior: 'smooth' }), 80);
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    /* ---------------- noroot ---------------- */
    let norootShown = 120;
    function renderNoroot(q) {
      $('#crumb').textContent = '无词根词';
      document.title = '无词根词 · ODH';
      $('#home-view').style.display = 'none';

      $('#noroot-view').style.display = 'block';
      const qq = (q || '').trim().toLowerCase();
      const filtered = qq ? NOROOT.filter(w => w.w.includes(qq) || (w.zh || '').includes(q)) : NOROOT;
      const slice = filtered.slice(0, norootShown);
      $('#noroot-view').innerHTML = `
        <a class="backlink" href="roots.html">← 全部词根</a>
        <div class="root-title"><div class="k" style="font-size:40px">无词根词</div><div class="zh">${filtered.length} 个</div></div>
        <div class="root-note">这些词在当前离线词库里没能严格拆成“前缀 + 词根 + 后缀”，单独罗列，避免硬套词根。仍然可以在精听页点词查义。</div>
        <div class="noroot-tools">
          <input class="big-search" id="noroot-search" placeholder="搜索单词 / 中文释义…" value="${esc(q || '')}" />
        </div>
        <div class="noroot-list">${slice.map(w => `<div class="nr-row">
          <span class="w">${esc(w.w)}</span><span class="ph">${esc(phText(w.p))}</span>
          <span class="zh">${esc(posText(w))}${esc(w.zh || '')}</span>
          <span class="lv">${esc(w.l || '')}</span>
        </div>`).join('') || '<div class="empty-card">没有匹配的词</div>'}</div>
        ${slice.length < filtered.length ? '<button class="big-btn load-more" id="noroot-more">加载更多</button>' : ''}`;
      $('#noroot-search').addEventListener('input', e => {

      });
