    /* ---------------- overlay base ---------------- */
    let overlayMode = null;
    function openOverlay(title, meta, html) {
      $('#sheet-title').textContent = title;
      $('#sheet-meta').textContent = meta || '';
      $('#sheet-body').innerHTML = html;
      $('#overlay').classList.add('on');
      document.body.style.overflow = 'hidden';
    }
    function closeOverlay() {
      $('#overlay').classList.remove('on');
      document.body.style.overflow = '';
      overlayMode = null;
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
      refreshFamiliarBadges();
    }
    $('#sheet-close').addEventListener('click', closeOverlay);
    $('#overlay').addEventListener('click', e => { if (e.target === $('#overlay')) closeOverlay(); });
    document.addEventListener('keydown', e => {
      if (wordModalOpen) {
        if (e.key === 'Escape') { e.preventDefault(); closeWordModal(); }
        return;
      }
      if (e.key === 'Escape' && $('#overlay').classList.contains('on')) closeOverlay();
      if (!overlayMode || !overlayMode.type) return;
      const L = overlayMode;
      if (L.type === 'learn' && (L.state === 'card' || L.state === 'round') &&
          (e.key === 'ArrowLeft' || e.key === 'Backspace')) {
        e.preventDefault();
        learnBack();
        return;
      }
      if (L.type === 'learn' && L.state === 'card' && e.key === 'ArrowRight') {
        e.preventDefault();
        nextLearn();
        return;
      }
      if (L.type === 'learn' && L.state === 'card') {
        if (e.key === '1') chooseLearn('know');
        if (e.key === '2') chooseLearn('fuzzy');
        if (e.key === '3') chooseLearn('dont');
        if (e.key === 's' || e.key === 'S') {
          const w = L.rounds[L.round] && L.rounds[L.round][L.idx];
          if (w) speakWord(w.w);
        }
      }
    });

    /* ---------------- learn mode ---------------- */
    function hfWordsOf(r) {
      const out = [];
      const seen = Object.create(null);
      r.routes.forEach(rt => rt.words.forEach(w => {
        if (!w.hf || seen[w.w]) return;
        seen[w.w] = 1;
        out.push(w);
      }));
      return out;
    }

    function startLearn(rootKey) {
      const r = rootKey ? rootByKey(rootKey) : (firstPendingRoot() || ROOTS[0]);
      if (!r) return;
      const all = hfWordsOf(r);
      if (!all.length) { toast('这个词根暂时没有六级高频词'); return; }
      let session = all.filter(w => needsRounds(w.w));
      const review = session.length === 0;
      if (review) session = all.slice();
      overlayMode = {
        type: 'learn', state: 'intro', root: r,
        words: session,
        allWords: all,
        review,
        rounds: [shuffle(session)],
        round: 0, idx: 0,
        stats: [{ know: 0, fuzzy: 0, dont: 0 }],
        unknown: [],
        history: [],
        forcedThisRound: new Set(),
        advanceTimer: null,
        locked: false,
      };
      renderLearnIntro();
    }

    const LEARN_ORDER = ['dict', 'spec', 'port', 'form', 'fic', 'duc', 'mit', 'vert', 'struct',
      'tract', 'ject', 'cept', 'set', 'sens', 'ven', 'tain', 'sist', 'pos', 'pel', 'fer', 'scrib',
      'grad', 'cred', 'vit', 'mort', 'vac', 'lev', 'quer', 'ceiv', 'medi', 'cid', 'tribut', 'corp',
      'greg', 'junct', 'temper', 'sper', 'trig', 'cand', 'fin', 'lect', 'volve', 'pict', 'mens'];
    function firstPendingRoot() {
      for (const k of LEARN_ORDER) {
        const r = rootByKey(k);
        if (r && hfWordsOf(r).some(w => needsRounds(w.w))) return r;
      }
      return ROOTS.find(r => hfWordsOf(r).some(w => needsRounds(w.w))) || null;
    }

    function learnHeader() {
      const L = overlayMode;
      const list = L.rounds[L.round] || [];
      const n = list.length;
      const label = L.round < 3 ? `第 ${L.round + 1}/3 轮` : `加练第 ${L.round + 1} 轮`;
      const famN = L.allWords.filter(w => wordLevel(w.w) === 'familiar').length;
      return {
        meta: `${label} · ${Math.min(L.idx + 1, n)}/${n} 词 · 已熟悉 ${famN}/${L.allWords.length}`,
        pct: n ? Math.round(L.idx / n * 100) : 0,
      };
    }

    function renderLearnIntro() {
      const L = overlayMode;
      const r = L.root;
      const h = learnHeader();
      const famN = L.allWords.filter(w => wordLevel(w.w) === 'familiar').length;
      openOverlay('词根 · ' + r.k, r.zh,
        `<div class="learn-progress"><i style="width:${h.pct}%"></i></div>
         <div class="learn-intro">
          <div class="li-root">${esc(r.k)}</div>
          <div class="li-zh">${esc(r.zh)}</div>
          <div class="li-note">${esc(r.note || '')}</div>
          <div class="li-meta">
            <div><b>${L.words.length}</b><span>本次要背</span></div>
            <div><b>${famN}</b><span>已熟悉</span></div>
            <div><b>${L.allWords.length}</b><span>词根总词</span></div>
            <div><b>${r.routes.length}</b><span>条路线</span></div>
          </div>
          <button class="learn-start" id="learn-go">开始记单词 →</button>
          <label class="tts-toggle"><input type="checkbox" id="tts-auto" ${ttsAuto ? 'checked' : ''}> 自动朗读单词（S 键也可发音）</label>
          <div class="lc-hint" style="margin-top:10px">${L.review ? '这个词根已经全部熟悉，本次是复习模式。' : '已标记“熟悉”的词不会进入本轮随机池；模糊 / 不认识的词会留到下一轮。'}点“不认识”会让该词重新计 3 轮。默认最多 3 轮，背完可继续加练。</div>
        </div>`);
      $('#tts-auto').addEventListener('change', e => {
        ttsAuto = e.target.checked;
        localStorage.setItem(TTS_KEY, ttsAuto ? '1' : '0');
        if (ttsAuto) speakWord(L.words[0].w);
        else { try { window.speechSynthesis.cancel(); } catch (err) {} }
      });
      $('#learn-go').addEventListener('click', () => {
        overlayMode.state = 'card';
        renderLearnCard();
      });
    }

    function renderLearnCard(reveal) {
      const L = overlayMode;
      const list = L.rounds[L.round];
      const w = list[L.idx];
      const h = learnHeader();
      const level = wordLevel(w.w);
      const relearn = relearnLeft(w.w);
      const canBack = L.history.length > 0;
      const curRound = L.round;
      const curIdx = L.idx;
      openOverlay('背 · ' + L.root.k, h.meta,
        `<div class="learn-progress"><i style="width:${h.pct}%"></i></div>
         <div class="learn-card">
          <div class="lc-toprow">
            <button class="learn-prev" id="learn-prev-card" ${canBack ? '' : 'disabled'}>← 上一个</button>
            <button class="learn-prev" id="learn-next-card">下一个 →</button>
            <span class="cur-fam">${relearn ? `<span class="relearn-badge">还要再背 ${relearn} 轮</span>` : ''}熟悉度 <span class="fam ${level}" id="learn-fam">${FAM[level]}</span></span>
          </div>
          <div class="lc-wordrow">
            <button class="lc-word" id="learn-word-btn" title="查看释义、例句与熟悉度">${esc(w.w)}</button>
            <button class="lc-speak" id="learn-speak" title="朗读（S）" aria-label="朗读单词">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 9.5v5h4l5 4V5.5l-5 4H4z"/><path d="M16 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/>
              </svg>
            </button>
            <button class="lc-mark${Object.prototype.hasOwnProperty.call(readJSON(UNKNOWN_KEY, {}), w.w) && !readJSON(UNKNOWN_KEY, {})[w.w].known ? ' on' : ''}" id="learn-mark" title="加入生词本 · 之后在单词库找它" aria-label="加入生词本">陌</button>
          </div>
          ${w.p ? `<div class="lc-ph">${esc(phText(w.p))}</div>` : ''}
          <div class="lc-break">${morphHtml(w)}</div>
          <div class="lc-mean ${reveal ? '' : 'hide'}" id="learn-mean">${esc(posText(w))}${esc(w.zh)}</div>
          <div class="lc-hint" id="learn-reveal">${reveal ? '已显示释义（回看）' : '点击释义可临时揭开'} · 1 认识 / 2 模糊 / 3 不认识</div>
          <div class="lc-hint" style="margin-top:4px">S 发音 · ← 上一个 · → 下一个 · 点单词看例句</div>
          <div class="learn-btns">
            <button class="know" data-learn-ans="know">认识</button>
            <button class="fuzzy" data-learn-ans="fuzzy">模糊</button>
            <button class="dont" data-learn-ans="dont">不认识</button>
          </div>
        </div>`);
      $('#learn-prev-card').addEventListener('click', learnBack);
      $('#learn-next-card').addEventListener('click', nextLearn);
      $('#learn-speak').addEventListener('click', () => speakWord(w.w));
      $('#learn-mark').addEventListener('click', () => {
        addUnknown(w.w, L.root.k);
        $('#learn-mark').classList.add('on');
        toast('已把 ' + w.w + ' 加入生词本 · 可在单词库找到');
      });
      $('#learn-word-btn').addEventListener('click', () => openWordModal(w, L.root.k));
      const mean = $('#learn-mean');
      mean.addEventListener('click', () => {
        mean.classList.toggle('hide');
        $('#learn-reveal').textContent = mean.classList.contains('hide') ? '点击释义可临时揭开' : '再次点击可遮住释义';
      });
      $$('#sheet-body [data-learn-ans]').forEach(b => b.addEventListener('click', () => chooseLearn(b.dataset.learnAns)));
      if (ttsAuto) {
        setTimeout(() => {
          if (overlayMode === L && L.state === 'card' && L.round === curRound && L.idx === curIdx) speakWord(w.w);
        }, 160);
      }
    }

    function advanceLearnCard(L) {
      L.locked = false;
      L.idx++;
      if (L.idx >= L.rounds[L.round].length) finishLearnRound();
      else renderLearnCard();
    }

    function nextLearn() {
      const L = overlayMode;
      if (!L || L.type !== 'learn' || L.state !== 'card') return;
      if (wordModalOpen) return;
      if (L.advanceTimer) { clearTimeout(L.advanceTimer); L.advanceTimer = null; }
      L.advancePending = false;
      L.locked = false;
      advanceLearnCard(L);
    }

    function chooseLearn(kind) {
      const L = overlayMode;
      if (!L || L.locked || L.state !== 'card') return;
      L.locked = true;
      const list = L.rounds[L.round];
      const w = list[L.idx];
      const level = kind === 'know' ? 'familiar' : kind === 'fuzzy' ? 'fuzzy' : 'unknown';
      const existedUnknown = Object.prototype.hasOwnProperty.call(readJSON(UNKNOWN_KEY, {}), w.w);
      L.history.push({
        round: L.round, idx: L.idx, word: w.w, kind,
        unknownAdded: kind === 'dont' && !existedUnknown,
        prevFam: Object.prototype.hasOwnProperty.call(learnData.familiar, w.w)
          ? Object.assign({}, learnData.familiar[w.w]) : null,
      });
      L.stats[L.round][kind]++;
      if (kind === 'dont') {
        addUnknown(w.w, L.root.k);
        L.unknown.push(w.w);
        L.forcedThisRound.add(w.w);
        setFamiliar(w.w, L.root.k, level);
        setRelearn(w.w, L.root.k, 3);
      } else {
        setFamiliar(w.w, L.root.k, level);
      }
      const famEl = $('#learn-fam');
      if (famEl) {
        famEl.className = 'fam ' + level;
        famEl.textContent = FAM[level];
      }
      const mean = $('#learn-mean');
      if (mean) mean.classList.remove('hide');
      $$('#sheet-body [data-learn-ans]').forEach(b => { b.disabled = true; });
      const label = kind === 'know' ? '认识 · 熟悉度已更新'
        : kind === 'fuzzy' ? '模糊 · 熟悉度已更新'
        : '不认识 · 已加入生词本 · 重新计 3 轮';
      const hint = $('#learn-reveal');
      if (hint) hint.textContent = label + ' · 点下一个可立即继续（← 可回看）';
      L.advanceTimer = setTimeout(() => {
        L.advanceTimer = null;
        if (overlayMode !== L || !$('#overlay').classList.contains('on')) return;
        if (wordModalOpen) { L.advancePending = true; return; }
        advanceLearnCard(L);
      }, AUTO_NEXT_MS);
    }

    function learnBack() {
      const L = overlayMode;
      if (!L || L.type !== 'learn' || L.locked) return;
      if (L.state !== 'card' && L.state !== 'round') return;
      if (!L.history.length) return;
      if (L.advanceTimer) { clearTimeout(L.advanceTimer); L.advanceTimer = null; }
      L.advancePending = false;
      const h = L.history.pop();
      if (h.kind === 'dont') L.forcedThisRound.delete(h.word);
      L.stats[h.round][h.kind] = Math.max(0, L.stats[h.round][h.kind] - 1);
      if (h.kind === 'dont' && h.unknownAdded) {
        removeRootUnknown(h.word, L.root.k);
        const i = L.unknown.indexOf(h.word);
        if (i >= 0) L.unknown.splice(i, 1);
      }
      if (h.prevFam) learnData.familiar[h.word] = h.prevFam;
      else delete learnData.familiar[h.word];
      writeJSON(LEARN_KEY, learnData);
      L.round = h.round;
      L.idx = h.idx;
      L.state = 'card';
      L.locked = false;
      renderLearnCard(true);
    }

    function finishLearnRound() {
      const L = overlayMode;
      L.state = 'round';
      const s = L.stats[L.round];
      const dec = roundDecWords(L);
      const remaining = remainingAfterRound(L, dec);
      const hasRemaining = remaining.length > 0;
      const maxed = L.round >= 2;
      const roundName = L.round < 3 ? `第 ${L.round + 1}/3 轮` : `加练第 ${L.round + 1} 轮`;
      const nextLabel = !hasRemaining ? '完成并保存 →'
        : maxed ? `继续背剩下的 ${remaining.length} 词 →`
        : `进入第 ${L.round + 2} 轮（${remaining.length} 词）→`;
      openOverlay('背 · ' + L.root.k, `${roundName}完成`,
        `<div class="round-done">
          <h3>${hasRemaining ? (maxed ? '这轮完成' : '本轮完成') : '全部熟悉了'}</h3>
          <p>${hasRemaining
            ? `还有 <b>${remaining.length}</b> 个词需要继续复习（模糊、不认识，或刚被重置为再背 3 轮），${maxed ? '可以继续加练，也可以先结束。' : '下一轮只会出现这些词。'}`
            : '本次要背的词已经全部标记为“熟悉”，不用再进入下一轮。'}</p>
          <div class="nums">
            <div class="n-know"><b>${s.know}</b><span>认识</span></div>
            <div class="n-fuzzy"><b>${s.fuzzy}</b><span>模糊</span></div>
            <div class="n-dont"><b>${s.dont}</b><span>不认识</span></div>
          </div>
          ${L.history.length ? '<button class="learn-prev" id="learn-prev-round" style="margin-bottom:12px">← 回到上一个词</button>' : ''}
          <div class="result-btns" style="justify-content:center">
            <button class="primary" id="learn-next">${nextLabel}</button>
            ${hasRemaining && maxed ? '<button id="learn-finish">先结束并保存</button>' : ''}
          </div>
        </div>`);
      const prevRound = $('#learn-prev-round');
      if (prevRound) prevRound.addEventListener('click', learnBack);
      $('#learn-next').addEventListener('click', () => {
        applyRoundRelearn(L, dec);
        if (!hasRemaining) { completeLearn(); return; }
        const nextList = shuffle(L.words.filter(w => needsRounds(w.w)));
        if (!nextList.length) { completeLearn(); return; }
        const nextNo = L.round + 1;
        if (L.rounds.length > nextNo) L.rounds[nextNo] = nextList;
        else L.rounds.push(nextList);
        if (L.stats.length > nextNo) L.stats[nextNo] = { know: 0, fuzzy: 0, dont: 0 };
        else L.stats.push({ know: 0, fuzzy: 0, dont: 0 });
        L.round = nextNo;
        L.idx = 0;
        L.state = 'card';
        renderLearnCard();
      });
      const finish = $('#learn-finish');
      if (finish) finish.addEventListener('click', () => { applyRoundRelearn(L, dec); completeLearn(); });
    }

    function completeLearn() {
      const L = overlayMode;
      L.state = 'done';
      const now = Date.now();
      L.allWords.forEach(w => {
        learnData.words[w.w] = { at: now, root: L.root.k };
      });
      learnData.roots[L.root.k] = { rounds: L.round + 1, at: now, n: L.allWords.length, done: true };
      writeJSON(LEARN_KEY, learnData);
      const total = L.stats.slice(0, L.round + 1).reduce((a, s) => ({ know: a.know + s.know, fuzzy: a.fuzzy + s.fuzzy, dont: a.dont + s.dont }), { know: 0, fuzzy: 0, dont: 0 });
      const left = L.words.filter(w => needsRounds(w.w)).length;
      const next = firstPendingRoot();
      openOverlay('词根 · ' + L.root.k, '已保存',
        `<div class="round-done">
          <h3>背完了</h3>
          <p>${L.root.k}（${esc(L.root.zh)}）· 本次 ${L.words.length} 词 · ${L.round + 1} 轮${left ? `，还有 <b>${left}</b> 个词未熟悉` : '，全部标记为熟悉'}。已计入“已背词”，可在检测模式中选择“已背 + 陌生”。</p>
          <div class="nums">
            <div class="n-know"><b>${total.know}</b><span>认识次数</span></div>
            <div class="n-fuzzy"><b>${total.fuzzy}</b><span>模糊次数</span></div>
            <div class="n-dont"><b>${total.dont}</b><span>不认识次数</span></div>
          </div>
          <div class="result-btns" style="justify-content:center">
            ${next ? `<button class="primary" id="learn-next-root">下一个词根：${esc(next.k)} →</button>` : ''}
            <button id="learn-again">再背一遍</button>
            <button id="learn-back">返回词根</button>
          </div>
        </div>`);
      const again = $('#learn-again');
      if (again) again.addEventListener('click', () => startLearn(L.root.k));
      const back = $('#learn-back');
      if (back) back.addEventListener('click', () => { closeOverlay(); location.href = 'roots.html?root=' + encodeURIComponent(L.root.k); });
      const nxt = $('#learn-next-root');
      if (nxt) nxt.addEventListener('click', () => startLearn(next.k));
    }

    /* ---------------- test mode ---------------- */
    let testSetup = { pool: 'all', count: 20 };

    function learnedPool() {
      const learn = Object.keys(learnData.words || {});
      const familiar = Object.keys(learnData.familiar || {});
      const unknown = Object.keys(readJSON(UNKNOWN_KEY, {}));
      const byWord = Object.create(null);
      ALL_WORDS.forEach(w => { byWord[w.w] = w; });
      const out = [];
      const seen = Object.create(null);
      learn.concat(familiar, unknown).forEach(w => {
        if (!seen[w] && byWord[w]) { seen[w] = 1; out.push(byWord[w]); }
      });
      return out;
    }

    function openTestSetup() {
      overlayMode = { type: 'test', state: 'setup' };
      const learned = learnedPool().length;
      openOverlay('单词检测', '选择范围和题量',
        `<div class="test-setup">
          <h3>检测哪些词？</h3>
          <div class="sub">题目随机抽词，给出 4 个中文释义，选出正确的一项。</div>
          <div class="opt-row"><div class="lab">词池</div><div class="choice-chips" id="pool-chips">
            <button data-pool="all" class="${testSetup.pool === 'all' ? 'on' : ''}">全部单词<span>${ALL_WORDS.length}</span></button>
            <button data-pool="learned" class="${testSetup.pool === 'learned' ? 'on' : ''}">已背 + 陌生<span>${learned}</span></button>
          </div></div>
          <div class="opt-row"><div class="lab">题量</div><div class="choice-chips" id="count-chips">
            ${[20, 50, 100, 0].map(n => `<button data-count="${n}" class="${testSetup.count === n ? 'on' : ''}">${n ? n + ' 题' : '全部'}</button>`).join('')}
          </div></div>
          <button class="test-start" id="test-go">开始检测 →</button>
        </div>`);
      $('#pool-chips').addEventListener('click', e => {
        const b = e.target.closest('[data-pool]');
        if (!b) return;
        testSetup.pool = b.dataset.pool;
        $$('#pool-chips button').forEach(x => x.classList.toggle('on', x === b));
      });
      $('#count-chips').addEventListener('click', e => {
        const b = e.target.closest('[data-count]');
        if (!b) return;
        testSetup.count = Number(b.dataset.count);
        $$('#count-chips button').forEach(x => x.classList.toggle('on', x === b));
      });
      $('#test-go').addEventListener('click', () => {
        const pool = testSetup.pool === 'learned' ? learnedPool() : ALL_WORDS;
        if (!pool.length) { toast('“已背 + 陌生”还是空的，先去背一个词根。'); return; }
        const n = testSetup.count || pool.length;
        startTest(pool, Math.min(n, pool.length), testSetup.pool === 'learned' ? '已背 + 陌生' : '全部单词');
      });
    }

    function startTest(pool, count, label) {
      const questions = buildQuestions(pool, count);
      overlayMode = {
        type: 'test', state: 'quiz', pool, questions, idx: 0,
        answers: [], label: label || '单词检测', locked: false,
      };
      renderTestCard();
    }

    function buildQuestions(pool, count) {
      const picked = shuffle(pool).slice(0, Math.max(1, count));
      return picked.map(item => {
        const opts = [item.zh];
        const others = shuffle(pool.filter(x => x.w !== item.w && x.zh !== item.zh));
        for (const o of others) {
          if (opts.length >= 4) break;
          if (!opts.includes(o.zh)) opts.push(o.zh);
        }
        if (opts.length < 2) {
          for (const o of shuffle(NOROOT)) {
            if (o.zh && !opts.includes(o.zh)) { opts.push(o.zh); if (opts.length >= 4) break; }
          }
        }
        return { w: item.w, p: item.p, zh: item.zh, pos: item.pos, options: shuffle(opts), answer: item.zh, rootKey: item.rootKey || '' };
      });
    }

    function renderTestCard() {
      const T = overlayMode;
      const q = T.questions[T.idx];
      const meta = `${T.idx + 1}/${T.questions.length} · ${T.label}`;
      openOverlay('检测 · ' + (q.rootKey || '词根库'), meta,
        `<div class="learn-progress"><i style="width:${Math.round(T.idx / T.questions.length * 100)}%"></i></div>
         <div class="test-card">
          <div class="test-word">${esc(q.w)}</div>
          ${q.p ? `<div class="test-ph">${esc(phText(q.p))}</div>` : ''}
          <div class="test-opts">${q.options.map((o, i) => `<button class="test-opt" data-opt="${i}">${esc(o)}</button>`).join('')}</div>
        </div>`);
      $$('#sheet-body [data-opt]').forEach(b => b.addEventListener('click', () => answerTest(Number(b.dataset.opt))));
    }

    function answerTest(i) {
      const T = overlayMode;
      if (!T || T.locked || T.state !== 'quiz') return;
      T.locked = true;
      const q = T.questions[T.idx];
      const sel = q.options[i];
      const ok = sel === q.answer;
      T.answers.push({ q, sel, ok });
      setFamiliar(q.w, q.rootKey || '', ok ? 'familiar' : 'unknown');
      $$('#sheet-body [data-opt]').forEach((b, j) => {
        b.disabled = true;
        if (q.options[j] === q.answer) b.classList.add('right');
        else if (j === i) b.classList.add('wrong');
      });
      setTimeout(() => {
        if (overlayMode !== T || !$('#overlay').classList.contains('on')) return;
        T.locked = false;
        T.idx++;
        if (T.idx >= T.questions.length) renderTestResult();
        else renderTestCard();
      }, ok ? 650 : 1050);
    }

    function renderTestResult() {
      const T = overlayMode;
      T.state = 'result';
      const right = T.answers.filter(a => a.ok).length;
      const wrong = T.answers.filter(a => !a.ok);
      const acc = T.answers.length ? Math.round(right / T.answers.length * 100) : 0;
      openOverlay('检测结果', `${T.label} · ${T.answers.length} 题`,
        `<div class="test-result">
          <div class="test-score"><b>${acc}%</b><span>正确 ${right} / ${T.answers.length}<br>${acc >= 90 ? '掌握得很稳' : acc >= 70 ? '大部分认识，错词再过一遍' : '错词建议加入生词本'}</span></div>
          ${wrong.length ? `<div class="wrong-list">${wrong.map(a => `<div class="wrong-row">
            <div><span class="w">${esc(a.q.w)}</span> <span style="font-size:11px;color:var(--muted)">${esc(a.q.rootKey || '')}</span></div>
            <div class="zh">正确：${esc(a.q.answer)}</div>
            <div class="zh" style="color:var(--danger)">你选：${esc(a.sel || '未选')}</div>
          </div>`).join('')}</div>` : '<div class="search-empty" style="margin-top:16px">全对，没有错词。</div>'}
          <div class="result-btns">
            ${wrong.length ? '<button class="primary" id="test-add-unknown">把错词加入生词本</button>' : ''}
            <button id="test-again">再测一次</button>
            <button id="test-back">返回</button>
          </div>
        </div>`);
      const add = $('#test-add-unknown');
      if (add) add.addEventListener('click', () => {
        wrong.forEach(a => addUnknown(a.q.w, a.q.rootKey || ''));
        toast('已把 ' + wrong.length + ' 个错词加入生词本');
        add.disabled = true;
      });
      const again = $('#test-again');
      if (again) again.addEventListener('click', () => startTest(T.pool, T.questions.length, T.label));
      const back = $('#test-back');
      if (back) back.addEventListener('click', closeOverlay);
    }

    /* ---------------- wiring ---------------- */
    $('#search').addEventListener('input', e => {
      const q = e.target.value;
      if (!q.trim()) { $('#search-panel').classList.remove('on'); $('#search-panel').innerHTML = ''; return; }
      renderSearch($('#search-panel'), q);
    });
    $('#btn-learn').addEventListener('click', () => startLearn(null));
    $('#btn-test').addEventListener('click', openTestSetup);
    $('#root-grid').addEventListener('click', e => {
      const card = e.target.closest('[data-k]');
      if (!card) return;
      e.preventDefault();
      location.href = 'roots.html?root=' + encodeURIComponent(card.dataset.k);
    });
    $('#detail-view').addEventListener('click', e => {
      const mark = e.target.closest('[data-mark-word]');
      if (mark) {
        e.preventDefault();
        e.stopPropagation();
        const w = mark.dataset.markWord;
        addUnknown(w, mark.dataset.markRoot);
        $$('#detail-view .wc-mark').forEach(b => {
          if (b.dataset.markWord === w) b.classList.add('on');
        });
        toast('已把 ' + w + ' 加入生词本 · 可在单词库找到');
        return;
      }
      const learn = e.target.closest('[data-learn]');
      if (learn) { startLearn(learn.dataset.learn); return; }
      const test = e.target.closest('[data-test-root]');
      if (test) {
        const r = rootByKey(test.dataset.testRoot);
        if (!r) return;
        const pool = [];
        r.routes.forEach(rt => rt.words.forEach(w => { if (w.hf) pool.push(w); }));
        const seen = Object.create(null), uniq = [];
        pool.forEach(w => { if (!seen[w.w]) { seen[w.w] = 1; uniq.push(Object.assign({}, w, { rootKey: r.k })); } });
        startTest(uniq, uniq.length, '词根 ' + r.k);
      }
    });

    /* ---------------- boot ---------------- */
    const wantedRoot = params.get('root');
    const view = params.get('view');
    if (wantedRoot) {
      renderDetail(wantedRoot, params.get('w'));
    } else if (view === 'noroot') {
      norootShown = 120;
      renderNoroot(params.get('q') || '');
    } else {
      renderHome();
      if (params.get('q')) {
        $('#search').value = params.get('q');
        renderSearch($('#search-panel'), params.get('q'));
      }
      if (params.get('learn')) setTimeout(() => startLearn(null), 60);
      if (params.get('test')) setTimeout(openTestSetup, 60);
    }
  })();
  </script>
</body>
</html>
